[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[project]
name = "antibody-utils"
version = "0.0.0"
description = "Utilities for antibody sequence and structure analysis."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENCE"]
authors = [
  { name = "Benjamin Heathcote Williams", email = "benjaminhwilliams@users.noreply.github.com" },
]
maintainers = [
  { name = "Oxford Protein Informatics Group", email = "opig@stats.ox.ac.uk" },
]
keywords = ["antibody", "immunoglobulin", "CDR", "numbering", "bioinformatics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = [
  "gemmi",
  "numpy",
]

[project.optional-dependencies]
numbering = ["anarcii>=2"]
canonicals = ["platformdirs"]

[project.urls]
Documentation = "https://antibody-utils.readthedocs.io"
Source = "https://github.com/oxpig/antibody-utils"
Issues = "https://github.com/oxpig/antibody-utils/issues"

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
  # Run docstring examples as tests; `conftest.py` does the same for Markdown.
  "--doctest-modules",
]
testpaths = ["tests", "src", "docs", "README.md"]
doctest_optionflags = ["NORMALIZE_WHITESPACE"]
markers = [
  "numbering: requires the `numbering` extra (ANARCII)",
  "pyigclassify2: requires a licensed copy of the PyIgClassify2 data",
]

[tool.coverage.run]
source = ["antibody_utils"]

[tool.ruff]
src = ["src", "tests"]
line-length = 88
lint.select = [
  "ERA",  # eradicate - https://docs.astral.sh/ruff/rules/#eradicate-era
  "S",    # flake8-bandit - https://docs.astral.sh/ruff/rules/#flake8-bandit-s
  "BLE",  # flake8-blind-except - https://docs.astral.sh/ruff/rules/#flake8-blind-except-ble
  "B",    # flake8-bugbear - https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
  "A",    # flake8-builtins - https://docs.astral.sh/ruff/rules/#flake8-builtins-a
  "C4",   # flake8-comprehensions - https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
  "DTZ",  # flake8-datetimez - https://docs.astral.sh/ruff/rules/#flake8-datetimez-dtz
  "EXE",  # flake8-executable - https://docs.astral.sh/ruff/rules/#flake8-executable-exe
  "FA",   # flake8-future-annotations - https://docs.astral.sh/ruff/rules/#flake8-future-annotations-fa
  "ISC",  # flake8-implicit-str-concat - https://docs.astral.sh/ruff/rules/#flake8-implicit-str-concat-isc
  "ICN",  # flake8-import-conventions - https://docs.astral.sh/ruff/rules/#flake8-import-conventions-icn
  "LOG",  # flake8-logging - https://docs.astral.sh/ruff/rules/#flake8-logging-log
  "G",    # flake8-logging-format - https://docs.astral.sh/ruff/rules/#flake8-logging-format-g
  "PIE",  # flake8-pie - https://docs.astral.sh/ruff/rules/#flake8-pie-pie
  "T20",  # flake8-print - https://docs.astral.sh/ruff/rules/#flake8-print-t20
  "PYI",  # flake8-pyi - https://docs.astral.sh/ruff/rules/#flake8-pyi-pyi
  "PT",   # flake8-pytest-style - https://docs.astral.sh/ruff/rules/#flake8-pytest-style-pt
  "RSE",  # flake8-raise - https://docs.astral.sh/ruff/rules/#flake8-raise-rse
  "RET",  # flake8-return - https://docs.astral.sh/ruff/rules/#flake8-return-ret
  "SIM",  # flake8-simplify - https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
  "TID",  # flake8-tidy-imports - https://docs.astral.sh/ruff/rules/#flake8-tidy-imports-tid
  "TC",   # flake8-type-checking - https://docs.astral.sh/ruff/rules/#flake8-type-checking-tc
  "PTH",  # flake8-use-pathlib - https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
  "FLY",  # flynt - https://docs.astral.sh/ruff/rules/#flynt-fly
  "I",    # isort - https://docs.astral.sh/ruff/rules/#isort-i
  "NPY",  # NumPy-specific rules - https://docs.astral.sh/ruff/rules/#numpy-specific-rules-npy
  "N",    # pep8-naming - https://docs.astral.sh/ruff/rules/#pep8-naming-n
  "PERF", # Perflint - https://docs.astral.sh/ruff/rules/#perflint-perf
  "E",    # pycodestyle errors - https://docs.astral.sh/ruff/rules/#error-e
  "W",    # pycodestyle warnings - https://docs.astral.sh/ruff/rules/#warning-w
  "D",    # pydocstyle - https://docs.astral.sh/ruff/rules/#pydocstyle-d
  "F",    # pyflakes rules - https://docs.astral.sh/ruff/rules/#pyflakes-f
  "PGH",  # pygrep-hooks - https://docs.astral.sh/ruff/rules/#pygrep-hooks-pgh
  "PLE",  # Pylint errors - https://docs.astral.sh/ruff/rules/#pylint-pl
  "PLW",  # Pylint warnings - https://docs.astral.sh/ruff/rules/#pylint-pl
  "UP",   # pyupgrade - https://docs.astral.sh/ruff/rules/#pyupgrade-up
  "FURB", # refurb - https://docs.astral.sh/ruff/rules/#refurb-furb
  "RUF",  # Ruff-specific rules - https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
]
# En dashes (in page ranges) and α (in Cα) are intended.
lint.allowed-confusables = ["–", "α"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101"] # No docstrings required; allow assert statements
"scripts/**/*.py" = ["S310"]    # URL fetches are the point of these scripts
"docs/**/*.py" = ["D"]
"docs/conf.py" = ["A001"] # Sphinx's `copyright` setting shadows the builtin

[tool.typos.files]
extend-exclude = ["tests/data/legacy/"]

[tool.typos.default]
locale = "en-gb"

[tool.typos.default.extend-identifiers]
NORMALIZE_WHITESPACE = "NORMALIZE_WHITESPACE" # doctest option flag

[tool.typos.default.extend-words]
blosum = "blosum" # BLOSUM substitution matrices
ser = "ser"       # Residue name
thr = "thr"       # Residue name

[tool.bumpversion]
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = true
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = ["uv lock", "git add uv.lock"]
post_commit_hooks = []

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = "version: {current_version}"
replace = "version: {new_version}"

[[tool.bumpversion.files]]
filename = "CITATION.cff"
regex = true
search = "date-released: \\d{{4}}-\\d{{2}}-\\d{{2}}"
replace = "date-released: {now:%Y-%m-%d}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## Unreleased"
replace = "## Unreleased\n\n## {new_version} ({now:%Y-%m-%d})"

[dependency-groups]
dev = [
    "bump-my-version>=1.4.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7",
    "sybil>=10.1.0",
]
docs = [
    "furo",
    "myst-parser",
    "sphinx>=8",
    "sphinx-autodoc-typehints",
]
