# Settings for `antibody_utils.canonicals`.  No PyIgClassify2 data is stored
# here or anywhere else in the package: users supply their own licensed copy.

[pyigclassify2]
licence_url = "https://dunbrack.fccc.edu/lab/PyIgClassify2_lic"
download_url = "https://dunbrack.fccc.edu/lab/PyIgClassify2_download"
data_file = "pyig_cdr_data.txt.gz"
citation = """\
Kelow S, Faezov B, Xu Q, Parker M, Adolf-Bryfogle J and Dunbrack RL Jr, \
"A penultimate classification of canonical antibody CDR conformations", \
bioRxiv (2022), https://doi.org/10.1101/2022.10.12.511988"""

[assignment]
# The number of most similar known CDRs that vote on a cluster.
neighbours = 5

# CDR4, the loop between strands D and E in framework 3, as IMGT positions.
# PyIgClassify2's CDRs 1-3 are those of the North definition (North, Lehmann
# and Dunbrack 2011, https://doi.org/10.1016/j.jmb.2010.10.030).
[cdr4]
H = [80, 87]
L = [80, 87]
