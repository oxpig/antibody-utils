# Framework and CDR boundaries for each region definition and chain.
#
# Each region is an inclusive range of IMGT positions (1-128).  Every
# definition's seven regions tile positions 1-128 without gaps or overlaps.
#
# Definitions other than IMGT were originally specified in their own numbering
# schemes; positions numbered in another scheme are mapped onto IMGT positions
# through `scheme_to_imgt.json`, with corrections for the cases where the
# schemes place insertions differently (see `antibody_utils.regions`).

