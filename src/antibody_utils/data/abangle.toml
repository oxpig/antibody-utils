# ABangle: VH/VL orientation angles.
#
# Dunbar J, Fuchs A, Shi J and Deane CM, "ABangle: characterising the VH-VL
# orientation in antibodies", Protein Eng Des Sel 26:611–620 (2013),
# https://doi.org/10.1093/protein/gzt020
#
# Ported from ABangle as implemented in SAbDab's legacy ABDB.  Each domain's
# coordinate frame is fixed by superposing a consensus domain on to the CA atoms
# of a "core set" of framework positions, which vary least in structure.
#
# The values come from ABangle's data files (consensus_H.pdb, consensus_L.pdb,
# pcH.txt, pcL.txt, Hcoresetfw.txt and Lcoresetfw.txt).  These files are
# identical in OPIG's ABangle repository (oxpig/abangle), which is released
# under the BSD 3-Clause licence, copyright (c) 2023, Oxford Protein Informatics
# Group.
#
# Positions are those of the original definition, in Chothia numbering, with
# their IMGT equivalents.  Coordinates are in angstroms.

[H]
# In the consensus frame: two unit vectors in the plane that ABangle fits
# to the domain, and a reference point (from pcH.txt).
plane_vectors = [[0.9525187, -0.1371821, 0.2718256], [-0.117058, 0.659152, 0.7428432]]
point = [-2.691829, -3.847092, 1.196887]
# The domain's end of the separation vector C is
# point + a * plane_vectors[0] + b * plane_vectors[1], with [a, b] =
separation = [-5.0, 0.5]

# The core set: CA coordinates of the consensus H domain (from
# consensus_H.pdb), by Chothia position, and the IMGT equivalent of each.
