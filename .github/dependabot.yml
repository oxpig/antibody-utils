# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Group all Python dependency updates into one PR.  The uv updater changes
    # `pyproject.toml` and `uv.lock` together.  (A `multi-ecosystem-groups`
    # group didn't respond to `@dependabot rebase` or `recreate`.)
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week.
      interval: "weekly"
