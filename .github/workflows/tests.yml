name: Tests
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Fetch and verify the BLOSUM62 matrix from NCBI
      run: uv run --no-project python scripts/fetch_blosum62.py
    - name: Run the tests (core install)
      run: uv run pytest --cov --cov-report=term-missing

  tests-numbering:
    name: Tests with the numbering extra (ANARCII)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    - name: Fetch and verify the BLOSUM62 matrix from NCBI
      run: uv run --no-project python scripts/fetch_blosum62.py
    - name: Install with the numbering extra, using CPU-only PyTorch wheels
      run: |
        uv venv
        uv pip install --torch-backend=cpu -e ".[numbering]" --group dev
    - name: Run the tests
      run: .venv/bin/pytest --cov --cov-report=term-missing

  pre-commit:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    - name: Run pre-commit
      run: uvx pre-commit run --all-files --show-diff-on-failure

  docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    - name: Fetch and verify the BLOSUM62 matrix from NCBI
      run: uv run --no-project python scripts/fetch_blosum62.py
    - name: Build the docs, treating warnings as errors
      run: uv run --group docs sphinx-build -W --keep-going -b html docs docs/_build/html

  # The single check required by the branch ruleset, so that changing the job
  # matrix never requires changing the ruleset.  Add any new job to `needs`.
  all-checks:
    name: All checks
    if: always()
    needs: [tests, tests-numbering, pre-commit, docs]
    runs-on: ubuntu-latest

    steps:
    - name: Fail unless every job succeeded
      if: >-
        contains(needs.*.result, 'failure')
        || contains(needs.*.result, 'cancelled')
        || contains(needs.*.result, 'skipped')
      run: exit 1
